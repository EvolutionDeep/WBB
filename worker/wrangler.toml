# Cloudflare Worker config for the WBB bridge.
# Deploy:  npx wrangler deploy
# Secrets (never stored in this file):
#   npx wrangler secret put BSC_RPC      # your Alchemy mainnet URL
#   npx wrangler secret put DAEMON_KEY   # same value as DAEMON_KEY in contracts/.env
name = "wbb-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Custom domain on the project's own zone (DNS + TLS auto-provisioned by CF).
routes = [
  { pattern = "api.bscworm.com", custom_domain = true },
]
workers_dev = true # keep the workers.dev URL alive as a secondary endpoint

[vars]
BRAIN_ADDRESS = "0x49E89C58bA3b1f4BEe9a9CFdbC00628cB33fC6A3" # WormBrainV2 (corrected-direction learning brain)

# KV is the single source of truth shared by ALL worker isolates (per-isolate
# memory is invisible between them): daemon-pushed snapshots/events live in
# WBB_STORE. The worker is a read-only bridge (no transaction, no key).
[[kv_namespaces]]
binding = "WBB_STORE"
id = "b962b3b0fcbb43ada4fe8710cd3a7cb4"
